name: Publish container image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      typst_version:
        description: "Typst version to bake into the image (overrides the default below)"
        required: false
        type: string

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ghcr.io/<owner>/typst-render-service — the service image the client talks to.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/typst-render-service

jobs:
  publish-container:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
      attestations: write # build provenance for the pushed digest
      id-token: write # sign the attestation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The .NET build stage runs natively on the amd64 runner; only the small
      # runtime stage (apk + the typst binary) is emulated per target arch.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No credentials on pull requests: forks can't get packages:write, and we
      # only build (not push) PRs anyway.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # latest/edge track main; releases get immutable semver tags. Every
          # build also gets a sha tag for precise rollbacks.
          tags: |
            type=edge,branch=main
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.description=Typst rendering service (ASP.NET minimal API + typst CLI) for TypstRender.Client.

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          # Repo root is the build context: the Dockerfile COPYs from src/**.
          context: .
          file: src/TypstRender.Service/Dockerfile
          # arm64 alongside amd64: Apple Silicon developers and arm64 hosts get a
          # native image instead of running the service under emulation.
          platforms: linux/amd64,linux/arm64
          # Don't push on PRs — build as a smoke test only.
          push: ${{ github.event_name != 'pull_request' }}
          # No pin here: the Dockerfile's ARG TYPST_VERSION is the single source
          # of truth (scripts/install-typst.sh reads it too), so published images
          # and local builds cannot drift. Only a manual run overrides it.
          build-args: ${{ github.event.inputs.typst_version && format('TYPST_VERSION={0}', github.event.inputs.typst_version) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # An SBOM and provenance make the published image auditable: what typst
          # version and which OS packages a given digest actually contains.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
