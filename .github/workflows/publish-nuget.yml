name: Publish NuGet package

on:
  push:
    tags:
      - "v*.*.*"

# Declaring any permission sets every unlisted scope to `none`, so `contents:
# read` has to be spelled out here — without it actions/checkout cannot read
# the repository.
permissions:
  contents: read

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # required to request the GitHub OIDC token for NuGet Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Derive package version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Typst
        run: bash ./scripts/install-typst.sh

      # Release gate: the whole suite, not just the client's, so a tag can never
      # publish a client that the service half no longer agrees with.
      - name: Test
        run: |
          source ./scripts/install-typst.sh.env
          dotnet test TypstRender.slnx --configuration Release

      - name: Pack
        run: |
          dotnet pack src/TypstRender.Client/TypstRender.Client.csproj \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -o ./artifacts

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # your nuget.org profile name, not email

      # *.nupkg and the matching *.snupkg symbol package, so consumers can step
      # into the client from their debugger.
      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload packed artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package-${{ steps.version.outputs.version }}
          path: ./artifacts/*.*nupkg
          if-no-files-found: warn
