name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Install Typst
        run: bash ./scripts/install-typst.sh

      # The whole solution, so a break in the client, the service, or the sample
      # is caught here — and so the client's netstandard2.0 target is actually
      # compiled (the test projects only ever pull in its net10.0 target, which
      # let a netstandard-only break slip through to `dotnet pack` at release).
      - name: Restore
        run: dotnet restore TypstRender.slnx

      - name: Build
        run: dotnet build TypstRender.slnx --no-restore --configuration Release

      - name: Test
        run: |
          source ./scripts/install-typst.sh.env
          dotnet test TypstRender.slnx \
            --no-build \
            --configuration Release \
            --logger trx \
            --results-directory ./TestResults

      # `always()`, not `failure()`: the .trx files are just as useful for
      # confirming which tests ran on a green build.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/**/*.trx
          if-no-files-found: warn

      # Packing on every build catches packaging regressions (a missing README,
      # a broken symbol package, an unpublished dependency) before a release tag.
      - name: Pack (validation only)
        run: dotnet pack src/TypstRender.Client/TypstRender.Client.csproj --no-build --configuration Release -o ./artifacts

      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.*nupkg
          if-no-files-found: warn
