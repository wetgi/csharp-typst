# Build and run the rendering service from source.
#
#   docker compose up --build -d
#
# To run the pre-built image from the GitHub Container Registry instead
# (no local build, no .NET SDK needed):
#
#   docker compose -f docker-compose.ghcr.yml up -d
services:
  typst-render:
    container_name: typst-render-service
    build:
      context: .
      # No TYPST_VERSION build arg: the Dockerfile's ARG is the single source of
      # truth, and scripts/install-typst.sh reads the same value.
      dockerfile: src/TypstRender.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      # The tunable knobs, shown at their defaults — see the README's
      # configuration table for what each one does.
      Render__TypstBinaryPath: typst
      Render__TimeoutSeconds: "30"
      Render__MaxUploadBytes: "20971520"
      Render__MaxExtractedBytes: "209715200"
      Render__MaxBundleEntries: "2000"
      Render__MaxConcurrency: "0"
      Render__QueueTimeoutSeconds: "10"
      Render__ShutdownTimeoutSeconds: "45"
    ports:
      - "8080:8080"
    # Renders unpack into /tmp; keeping it on a sized tmpfs writes nothing to the
    # container layer and bounds how much disk one oversized bundle can claim.
    tmpfs:
      - /tmp:size=512m
    restart: unless-stopped
